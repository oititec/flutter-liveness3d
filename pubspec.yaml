name: oiti_liveness3d
description: A pluggin from Oititec to add Livenees3d on your project.
version: 3.1.1
homepage: "https://oititec.com.br/"
repository: "https://github.com/oititec/flutter-liveness3d"

environment:
  sdk: ">=2.19.2 <4.0.0"
  flutter: ">=2.5.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_redux: ^0.10.0
  flutter_screenutil: ^5.7.0
  redux: ^5.0.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  assets:
    - lib/assets/images/
    # - packages/oiti_liveness3d/assets/images/

  plugin:
    platforms:
      android:
        package: br.com.oitiliveness3d.oiti_liveness3d
        pluginClass: OitiLiveness3dPlugin
      ios:
        pluginClass: OitiLiveness3dPlugin
